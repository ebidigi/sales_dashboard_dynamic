<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>稼働報酬チーム営業KPI確認シート | DigiMan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">データを読み込んでいます...</div>
    </div>

    <!-- ヘッダー -->
    <header class="top-header">
        <div class="logo">
            <img src="logo.png" alt="Logo" style="height: 32px; width: auto;">
            <span class="logo-text">DigiMan</span>
        </div>
        <div class="header-right">
            <span class="last-updated" id="lastUpdated"></span>
            <button class="refresh-btn" onclick="refreshData()" id="refreshBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                </svg>
                更新
            </button>
        </div>
    </header>

    <!-- アプリコンテナ（サイドバー + メイン） -->
    <div class="app-container">
        <!-- サイドバー -->
        <aside class="sidebar" id="sidebar">
            <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="toggleIcon">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>
            <nav class="sidebar-nav">
                <button class="sidebar-item active" data-tab="overview" onclick="switchTab('overview')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    <span class="sidebar-item-text">概要</span>
                </button>
                <button class="sidebar-item" data-tab="analysis" onclick="switchTab('analysis')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 20V10M12 20V4M6 20v-6"/>
                    </svg>
                    <span class="sidebar-item-text">分析</span>
                </button>
            </nav>
        </aside>

        <!-- メインコンテンツ -->
        <div class="main-content">
            <div class="dashboard">
                <div class="page-title-row">
                    <div class="page-title">
                        <h1>稼働報酬チーム営業KPI確認シート<span class="progress-badge" id="progressBadge">標準進捗: --%</span></h1>
                        <div style="display:flex;align-items:center;gap:8px;">
                            <p class="subtitle" id="dateInfo">月次ビュー</p>
                            <div class="month-selector" id="monthSelector">
                                <button class="month-nav-btn" id="monthPrev" onclick="changeOverviewMonth(-1)">&#9664;</button>
                                <span class="month-display" id="monthDisplay"></span>
                                <button class="month-nav-btn" id="monthNext" onclick="changeOverviewMonth(1)">&#9654;</button>
                            </div>
                        </div>
                    </div>
                    <div class="progress-toggle-section" id="progressToggleSection" style="display: none;">
                        <span class="toggle-label">比較基準:</span>
                        <div class="progress-toggle-buttons">
                            <button class="progress-toggle-btn" data-mode="yesterday" onclick="toggleProgressMode('yesterday')">
                                前日終了時
                                <span class="toggle-value" id="yesterdayProgressValue">--%</span>
                            </button>
                            <button class="progress-toggle-btn active" data-mode="today" onclick="toggleProgressMode('today')">
                                本日時点
                                <span class="toggle-value" id="todayProgressValue">--%</span>
                            </button>
                            <button class="progress-toggle-btn" data-mode="tomorrow" onclick="toggleProgressMode('tomorrow')">
                                明日時点
                                <span class="toggle-value" id="tomorrowProgressValue">--%</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="error-message" id="errorMessage"></div>

        <!-- 概要タブ（既存のダッシュボード） -->
        <div id="mainContent" style="display: none;">
            <div class="sales-target-card" id="salesTargetCard"></div>
            <div class="kpi-summary" id="kpiSummary"></div>
            <div class="analysis-section" id="analysisSection"></div>
            <div class="filter-section" id="filterSection"></div>

            <div class="member-section">
                <div class="section-title">担当者別 進捗状況</div>
                <div class="member-grid" id="memberGrid"></div>
            </div>

            <div class="section-title">案件別 進捗状況</div>
            <div class="charts-section">
                <div class="chart-card full-width">
                    <h3>架電進捗 vs アポ進捗（標準進捗ライン付き）</h3>
                    <div class="chart-container">
                        <canvas id="progressCompareChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="section-title">案件別 進捗率ランキング</div>
            <div class="charts-section">
                <div class="chart-card">
                    <h3>架電進捗率</h3>
                    <div class="chart-container">
                        <canvas id="callRankChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <h3>アポ進捗率</h3>
                    <div class="chart-container">
                        <canvas id="appoRankChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="section-title">個人別 進捗状況</div>
            <div class="charts-section">
                <div class="chart-card full-width">
                    <h3>架電進捗 vs アポ進捗（標準進捗ライン付き）</h3>
                    <div class="chart-container">
                        <canvas id="memberProgressCompareChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="section-title">個人別 進捗率ランキング</div>
            <div class="charts-section">
                <div class="chart-card">
                    <h3>架電進捗率</h3>
                    <div class="chart-container">
                        <canvas id="memberCallRankChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <h3>アポ進捗率</h3>
                    <div class="chart-container">
                        <canvas id="memberAppoRankChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- 分析タブ -->
        <div id="analysisContent" style="display: none;">
            <div class="analysis-filter-section" id="analysisFilterSection">
                <div class="filter-group-label">案件で絞り込み</div>
                <div class="filter-row" id="analysisProjectFilterRow"></div>

                <div class="filter-group-label">担当者で絞り込み</div>
                <div class="filter-row" id="analysisMemberFilterRow"></div>

                <div class="selected-tags empty" id="analysisSelectedTags"></div>

                <div class="filter-date-row">
                    <label>期間:</label>
                    <input type="date" id="analysisStartDate">
                    <span>〜</span>
                    <input type="date" id="analysisEndDate">
                    <button class="filter-btn" onclick="applyAnalysisFilters()">適用</button>
                </div>
            </div>

            <!-- 実数指標 -->
            <div class="analysis-kpi-section">
                <div class="analysis-kpi-title">実数指標</div>
                <div class="analysis-kpi-grid" id="analysisNumberKPIs"></div>
            </div>

            <!-- 率指標 -->
            <div class="analysis-kpi-section">
                <div class="analysis-kpi-title">率指標</div>
                <div class="analysis-kpi-grid" id="analysisRateKPIs"></div>
            </div>

            <!-- 日次推移グラフ -->
            <div class="analysis-chart-section">
                <div class="section-title">日次推移グラフ</div>
                <div class="chart-type-selector">
                    <button class="chart-type-btn active" data-chart="calls">架電数</button>
                    <button class="chart-type-btn" data-chart="pr">PR数</button>
                    <button class="chart-type-btn" data-chart="appo">アポ数</button>
                    <button class="chart-type-btn" data-chart="callToPR">架電toPR率</button>
                    <button class="chart-type-btn" data-chart="prToAppo">PRtoアポ率</button>
                    <button class="chart-type-btn" data-chart="callToAppo">架電toアポ率</button>
                    <button class="chart-type-btn" data-chart="callsPerHour">架電数/H</button>
                </div>
                <div class="chart-compare-toggle">
                    <label class="compare-toggle-label">
                        <input type="checkbox" id="compareMonthToggle" onchange="toggleMonthCompare()">
                        <span class="compare-toggle-text">前月と比較</span>
                    </label>
                </div>
                <div class="chart-container">
                    <canvas id="analysisDailyChart"></canvas>
                </div>
            </div>
        </div>


                <div class="footer">
                    &copy; DigiMan Inc.
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
